<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteúdos Educativos — Letícia Dalprá</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <div class="container header-inner">

    <div class="brand">
      <h1>Letícia Dalprá</h1>
      <div class="micro">Futura Nutricionista</div>
    </div>

    <div class="header-actions">

      <button id="menuToggle" class="menu-toggle" aria-label="Abrir menu">
        ☰
      </button>

      <button id="darkToggle" class="dark-toggle" aria-label="Alternar modo escuro">
        🌙
      </button>

    </div>

  </div>

  <nav id="mobileMenu" class="mobile-menu">
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="historia.html">Minha História</a></li>
      <li><a href="receitas.html">Receitas</a></li>
      <li><a href="conteudos.html">Conteúdos Educativos</a></li>
      <li><a href="contato.html">Contato</a></li>
    </ul>
  </nav>
</header>


<section class="receitas-section">

  <div class="receitas-grid">

    <a href="conteudo1.html" class="receita-card slide-up">
      <img src="conteudo1.jpeg" alt="">
      <h3>Comer bem não é comer pouco</h3>
    </a>

    <a href="conteudo2.html" class="receita-card slide-up">
      <img src="conteudo2.jpeg" alt="">
      <h3>Método do Prato Saudável</h3>
    </a>

    <a href="conteudo3.html" class="receita-card slide-up">
      <img src="conteudo3.jpeg" alt="">
      <h3>Como o sono afeta a alimentação</h3>
    </a>

    <a href="conteudo4.html" class="receita-card slide-up">
      <img src="conteudo4.jpeg" alt="Como ler rótulos de alimentos">
      <h3>Como ler rótulos de alimentos</h3>
    </a>

    <a href="conteudo5.html" class="receita-card slide-up">
      <img src="conteudo5.jpeg" alt="Mitos sobre carboidratos">
      <h3>Mitos sobre Carboidratos</h3>
    </a>

  </div>

</section>


<script>

  /* =========================
     DARK MODE
  ========================= */

  const toggle = document.getElementById('darkToggle');

  if (localStorage.getItem('darkMode') === 'true') {
    document.documentElement.classList.add('dark');
  }

  toggle.addEventListener('click', () => {

    document.documentElement.classList.toggle('dark');

    localStorage.setItem(
      'darkMode',
      document.documentElement.classList.contains('dark')
    );

  });


  /* =========================
     MENU
  ========================= */

  const menuToggle = document.getElementById('menuToggle');
  const mobileMenu = document.getElementById('mobileMenu');

  menuToggle.addEventListener('click', () => {

    mobileMenu.classList.toggle('active');

    if (mobileMenu.classList.contains('active')) {

      menuToggle.textContent = '✕';

      menuToggle.setAttribute(
        'aria-label',
        'Fechar menu'
      );

    } else {

      menuToggle.textContent = '☰';

      menuToggle.setAttribute(
        'aria-label',
        'Abrir menu'
      );

    }

  });

</script>
</body>
</html>
