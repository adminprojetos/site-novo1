<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato — Letícia Dalprá</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

  <div class="container header-inner">

    <a href="index.html" class="brand">
      <h1>Letícia Dalprá</h1>
      <span class="micro">Futura Nutricionista</span>
    </a>

    <div class="header-actions">

      <!-- MODO ESCURO -->
      <button
        id="darkToggle"
        class="dark-toggle"
        aria-label="Alternar modo escuro"
        type="button">
        🌙
      </button>

      <!-- MENU -->
      <button
        id="menuToggle"
        class="menu-toggle"
        aria-label="Abrir menu"
        aria-expanded="false"
        type="button">
        ☰
      </button>

    </div>

  </div>

</header>


<!-- =========================
     MENU LATERAL
========================= -->

<nav id="mobileMenu" class="mobile-menu" aria-hidden="true">

  <div class="mobile-menu-inner">

    <button
      id="menuClose"
      class="menu-close"
      aria-label="Fechar menu"
      type="button">
      ×
    </button>

    <ul>

      <li>
        <a href="index.html">Início</a>
      </li>

      <li>
        <a href="sobre.html">Sobre o site</a>
      </li>

      <li>
        <a href="historia.html">Minha História</a>
      </li>

      <li>
        <a href="receitas.html">Receitas</a>
      </li>

      <li>
        <a href="conteudos.html">Conteúdos Educativos</a>
      </li>

      <li>
        <a href="contato.html">Contato</a>
      </li>

    </ul>

  </div>

</nav>

<section class="contato-pro">

  <div class="container contato-inner">

    <div class="contato-cards">

      <h2 class="contato-title">
        Fale comigo!
      </h2>

      <p class="contato-sub">
        Escolha uma forma de contato — respondo rapidinho.
      </p>

      <a
        href="mailto:leticiadalpra09@gmail.com"
        class="card-click">

        <div class="icon">

          <svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor">

            <path d="M4 4h16v16H4z"/>
            <path d="M4 8l8 5 8-5"/>

          </svg>

        </div>

        <div>
          <h3>E-mail</h3>
          <p>leticiadalpra09@gmail.com</p>
        </div>

      </a>


      <a
        href="https://instagram.com/nutrileticiadeavilad"
        target="_blank"
        class="card-click">

        <div class="icon">

          <svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor">

            <rect
              x="4"
              y="4"
              width="16"
              height="16"
              rx="4"/>

            <circle
              cx="12"
              cy="12"
              r="3"/>

            <circle
              cx="16.5"
              cy="7.5"
              r="1"/>

          </svg>

        </div>

        <div>
          <h3>Instagram</h3>
          <p>@nutrileticiadeavilad</p>
        </div>

      </a>
      
    </div>

    <div class="contato-foto fade-in">

      <img
        src="eu.jpeg"
        alt="Foto de Letícia">

    </div>

  </div>

</section>


<script>

  /* =========================
     DARK MODE
  ========================= */

  const darkToggle =
    document.getElementById('darkToggle');

  if (localStorage.getItem('darkMode') === 'true') {
    document.documentElement.classList.add('dark');
  }

  darkToggle.addEventListener('click', () => {

    document.documentElement.classList.toggle('dark');

    localStorage.setItem(
      'darkMode',
      document.documentElement.classList.contains('dark')
    );

  });


  /* =========================
     MENU
  ========================= */

  const menuToggle =
    document.getElementById('menuToggle');

  const mobileMenu =
    document.getElementById('mobileMenu');

  const menuClose =
    document.getElementById('menuClose');


  /* ABRIR */

  menuToggle.addEventListener('click', () => {

    mobileMenu.classList.add('active');

    mobileMenu.setAttribute(
      'aria-hidden',
      'false'
    );

    menuToggle.setAttribute(
      'aria-expanded',
      'true'
    );

  });


  /* FECHAR PELO X */

  menuClose.addEventListener('click', () => {

    mobileMenu.classList.remove('active');

    mobileMenu.setAttribute(
      'aria-hidden',
      'true'
    );

    menuToggle.setAttribute(
      'aria-expanded',
      'false'
    );

  });


  /* FECHAR AO CLICAR EM UMA PÁGINA */

  const menuLinks =
    mobileMenu.querySelectorAll('a');

  menuLinks.forEach(link => {

    link.addEventListener('click', () => {

      mobileMenu.classList.remove('active');

      mobileMenu.setAttribute(
        'aria-hidden',
        'true'
      );

      menuToggle.setAttribute(
        'aria-expanded',
        'false'
      );

    });

  });

</script>

</body>

</html>
