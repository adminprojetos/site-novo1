<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receitas — Letícia Dalprá</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

  <div class="container header-inner">

    <a href="index.html" class="brand">
      <h1>Letícia Dalprá</h1>
      <span class="micro">Futura Nutricionista</span>
    </a>

    <div class="header-actions">

      <!-- MODO ESCURO -->
      <button
        id="darkToggle"
        class="dark-toggle"
        aria-label="Alternar modo escuro"
        type="button">
        🌙
      </button>

      <!-- MENU -->
      <button
        id="menuToggle"
        class="menu-toggle"
        aria-label="Abrir menu"
        aria-expanded="false"
        type="button">
        ☰
      </button>

    </div>

  </div>

</header>


<!-- =========================
     MENU LATERAL
========================= -->

<nav id="mobileMenu" class="mobile-menu" aria-hidden="true">

  <div class="mobile-menu-inner">

    <button
      id="menuClose"
      class="menu-close"
      aria-label="Fechar menu"
      type="button">
      ×
    </button>

    <ul>

      <li>
        <a href="index.html">Início</a>
      </li>

      <li>
        <a href="sobre.html">Sobre o site</a>
      </li>

      <li>
        <a href="historia.html">Minha História</a>
      </li>

      <li>
        <a href="receitas.html">Receitas</a>
      </li>

      <li>
        <a href="conteudos.html">Conteúdos Educativos</a>
      </li>

      <li>
        <a href="contato.html">Contato</a>
      </li>

    </ul>

  </div>

</nav>


<section class="receitas-section">

  <div class="receitas-grid">

    <a href="overnight.html" class="receita-card slide-up">
      <img src="overnight.jpeg" alt="Overnight oats">
      <h3>Overnight Oats</h3>
    </a>

    <a href="ovo-mexido.html" class="receita-card slide-up">
      <img src="ovo-mexido.jpeg" alt="Ovo mexido rápido">
      <h3>Lanche rápido de ovo mexido</h3>
    </a>

    <a href="granola.html" class="receita-card slide-up">
      <img src="granola.jpeg" alt="Granola caseira">
      <h3>Iogurte com granola caseira</h3>
    </a>

    <a href="sorvete.html" class="receita-card slide-up">
      <img src="sorvete.jpeg" alt="Sorvete saudável de banana">
      <h3>Sorvete Saudável de Banana</h3>
    </a>

    <a href="bolo-mesclado.html" class="receita-card slide-up">
      <img src="bolo.jpeg" alt="Bolo mesclado sem açúcar">
      <h3>Bolo sem açúcar e sem glúten</h3>
    </a>

  </div>

</section>


<script>

  /* =========================
     DARK MODE
  ========================= */

  const darkToggle =
    document.getElementById('darkToggle');

  if (localStorage.getItem('darkMode') === 'true') {
    document.documentElement.classList.add('dark');
  }

  darkToggle.addEventListener('click', () => {

    document.documentElement.classList.toggle('dark');

    localStorage.setItem(
      'darkMode',
      document.documentElement.classList.contains('dark')
    );

  });


  /* =========================
     MENU
  ========================= */

  const menuToggle =
    document.getElementById('menuToggle');

  const mobileMenu =
    document.getElementById('mobileMenu');

  const menuClose =
    document.getElementById('menuClose');


  /* ABRIR */

  menuToggle.addEventListener('click', () => {

    mobileMenu.classList.add('active');

    mobileMenu.setAttribute(
      'aria-hidden',
      'false'
    );

    menuToggle.setAttribute(
      'aria-expanded',
      'true'
    );

  });


  /* FECHAR PELO X */

  menuClose.addEventListener('click', () => {

    mobileMenu.classList.remove('active');

    mobileMenu.setAttribute(
      'aria-hidden',
      'true'
    );

    menuToggle.setAttribute(
      'aria-expanded',
      'false'
    );

  });


  /* FECHAR AO CLICAR EM UMA PÁGINA */

  const menuLinks =
    mobileMenu.querySelectorAll('a');

  menuLinks.forEach(link => {

    link.addEventListener('click', () => {

      mobileMenu.classList.remove('active');

      mobileMenu.setAttribute(
        'aria-hidden',
        'true'
      );

      menuToggle.setAttribute(
        'aria-expanded',
        'false'
      );

    });

  });

</script>

</body>
</html>
